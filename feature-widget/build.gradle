// Il widget "MyCloud Gallery" della Fase 10 (docs/fase10-progetto.md §1.1, §1.4, §1.5, D3-D11): il widget Glance sopra `engine-widget` nelle tre
// misure, il ricevitore (**non esportato**), il lavoro periodico `widget-refresh` (`work/`), il ridisegno (`refresh/`, `GlanceWidgetRefresher`),
// le bitmap delle miniature locali (`bitmap/`), il tocco (`tap/`: l'unico posto che costruisce l'azione verso `MainActivity`) e l'anteprima
// disegnata del selettore dei widget. Tutto di P3.
//
// Stati e contratti: `contract/WidgetUiState` (P0, D38: l'aspetto e' della fase grafica). **Glance ed `engine-widget` stanno solo qui**
// (scaricamento approvato il 31/10, Q9 (a); Phase10ArchitectureTest, `tools/check.ps1` sul dex). Cieca a core-nas, core-network, al codice
// interno di core-memories e agli altri feature-*: vede core-widget (contratti), core-describe (la descrizione `WIDGET`: solo tipo e data) e
// core-designsystem (il marchio, `GalleryAccent`).
//
// Il grafo (`WidgetServices`: pianificatore, registro, miniature, preferenze, blocco, orologio) lo monta `:app` (P13, `WidgetGraph`) e lo mette in
// `WidgetHost`; finche' non c'e' (un processo freddo, la lezione di NT-1 della Fase 9) il widget **non disegna niente di nuovo** e lascia quello che ha.
// Nessuna rete (NoNetworkSourcesTest), nessun orologio del telefono (NoWallClockSourcesTest): l'ora arriva da `WidgetClock`.
plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'io.github.takahirom.roborazzi'
}

apply from: "${rootDir}/engine/versions.gradle"
apply from: "${rootDir}/versions-app.gradle"
apply from: "${rootDir}/gradle/android-conventions.gradle"

android {
  namespace = 'dev.pampa.mycloudgallery.feature.widget'

  buildFeatures {
    compose = true
  }

  testOptions {
    unitTests.all {
      maxHeapSize = '2g'
    }
  }
}

dependencies {
  // api: il piano e i suoi tipi (WidgetPlan, WidgetMode, WidgetTitle) compaiono nello stato.
  api project(':core-widget')

  // Il kit del widget (palette, budget, componenti) e Glance, che il kit porta come `api`; qui si dichiarano comunque le coordinate che il codice usa.
  implementation project(':engine-widget')
  implementation appDeps.glance
  implementation appDeps.glanceAppwidget

  // Il marchio (GalleryAccent per la palette) e la descrizione della superficie WIDGET (solo tipo e data).
  implementation project(':core-designsystem')
  implementation project(':core-describe')

  implementation project(':core-common')
  implementation project(':core-model')

  implementation appDeps.workRuntimeKtx
  implementation appDeps.coroutinesAndroid

  testImplementation appDeps.coroutinesTest
  testImplementation appDeps.robolectric
  testImplementation appDeps.androidxTestCore
  testImplementation appDeps.androidxTestExtJunit
  testImplementation appDeps.workTesting
  testImplementation appDeps.roborazzi
}
