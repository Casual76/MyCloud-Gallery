import com.android.build.api.artifact.SingleArtifact

plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'org.jetbrains.kotlin.plugin.serialization'
  id 'com.google.devtools.ksp'
  id 'com.google.dagger.hilt.android'
  id 'io.github.takahirom.roborazzi'
  // Fase 3 (P0, docs/fase3-progetto.md §2.6): crea le varianti di misura `benchmarkRelease` e `nonMinifiedRelease`
  // partendo dalla release e collega il Baseline Profile generato da `:benchmark`.
  id 'androidx.baselineprofile'
}

apply from: "${rootDir}/engine/versions.gradle"
apply from: "${rootDir}/versions-app.gradle"
apply from: "${rootDir}/gradle/android-conventions.gradle"
apply from: "${rootDir}/gradle/verify-release-manifest.gradle"

// Firma di release (pampa.jks, condivisa con le altre app Pampa; Fase 10, D32: nessuna chiave nuova). Le quattro chiavi pampa.* stanno in
// local.properties, fuori da git; NON vanno copiate da nessun altro progetto e non vanno mai nel repo:
//   pampa.storeFile=C:/percorso/pampa.jks
//   pampa.keyAlias=pampa
//   pampa.storePassword=...
//   pampa.keyPassword=...
// Senza, la release si compila lo stesso ma resta NON FIRMATA (nessun errore, nessun avviso rumoroso):
// e' la build di verifica di tools/check.ps1, non qualcosa che si installa o si pubblica.
//
// Fase 10 (P12): le stesse quattro voci si possono dare anche come proprieta' di Gradle (`-Ppampa.storeFile=...`): vincono su
// local.properties. Serve SOLO a `tools/release/release.ps1 -TestKeystore` e alle sue prove, che firmano con un keystore di prova generato
// sotto build\ (mai con pampa.jks); la release vera non passa mai niente da qui.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
  localPropertiesFile.withInputStream { localProperties.load(it) }
}
def signingProperty = { String key, String fallback = '' ->
  def given = project.findProperty(key)
  def value = (given != null ? given.toString() : localProperties.getProperty(key))
  return (value ?: fallback).trim()
}
def releaseStoreFile = signingProperty('pampa.storeFile')
def releaseStorePassword = signingProperty('pampa.storePassword')
def hasReleaseKey = !releaseStoreFile.isEmpty() && !releaseStorePassword.isEmpty()
// Gli schemi di firma (D32): v2 e v3 sempre; la v1 (JAR) resta accesa perche' il publisher del Pampa Store la cerca per dire "firmato" (commento
// storico qui sotto) e con minSdk 29 e' innocua. `-Pmcg.signV1=false` la spegne se la prova a secco del publisher dice che non serve
// (docs/decisioni.md, "Fase 10 P12"): `release.ps1` pretende v2 e v3 e riporta se la v1 c'e'.
def signV1 = project.findProperty('mcg.signV1') != 'false'

// Versione dell'app: l'ULTIMA riga dati di release/versions.txt (D33; docs/decisioni.md, "Fase 10 P12"). Una sola fonte per `versionName`,
// `versionCode`, il controllo "mai riusato" di release.ps1 e il registro di cio' che e' stato pubblicato. Formato di una riga, colonne separate da
// spazi: `<versionName> <versionCode> <stato> <canale> <data> <sha256 dell'APK>`; qui servono le prime due.
def releaseVersion = {
  def file = rootProject.file('release/versions.txt')
  if (!file.exists()) {
    throw new GradleException("Manca release/versions.txt: da li' vengono versionName e versionCode (docs/decisioni.md, Fase 10 P12).")
  }
  def rows = file.readLines('UTF-8').collect { it.trim() }.findAll { it && !it.startsWith('#') }
  if (rows.isEmpty()) throw new GradleException("release/versions.txt non ha nessuna riga di versione.")
  def columns = rows.last().split(/\s+/)
  if (columns.length < 2 || !(columns[0] ==~ /\d+\.\d+\.\d+(-beta\.\d+)?/) || !(columns[1] ==~ /[1-9]\d{0,8}/)) {
    throw new GradleException("Ultima riga di release/versions.txt non valida: servono '<versione> <versionCode>' (per esempio '1.0.0 1').")
  }
  return [name: columns[0], code: columns[1] as int]
}.call()

android {
  namespace = 'dev.pampa.mycloudgallery'

  defaultConfig {
    applicationId = 'dev.pampa.mycloudgallery'
    // minSdk e compileSdk vengono da android-conventions.gradle (engine.minSdk = 29, engine.compileSdk = 36).
    // Il target e' una decisione di prodotto e non segue il compileSdk dell'engine: vedi versions-app.gradle.
    targetSdk = appSdk.targetSdk
    versionCode = releaseVersion.code
    versionName = releaseVersion.name

    // Fase 6 (P0, docs/fase6-progetto.md D3): le librerie native dei motori on-device (LiteRT-LM, LiteRT, ML Kit) solo per
    // arm64-v8a (S25, Tab S9) e x86_64 (gli emulatori dei test strumentati). `liblitertlm_jni.so` esiste solo per queste due;
    // armeabi-v7a e x86 di ML Kit e LiteRT non entrerebbero che come peso. Allineamento a 16 KB controllato da tools/check.ps1.
    // P11: la release e la benchmarkRelease tolgono x86_64 al momento dell'impacchettamento (vedi `androidComponents` qui sotto).
    ndk {
      abiFilters 'arm64-v8a', 'x86_64'
    }
  }

  signingConfigs {
    if (hasReleaseKey) {
      release {
        storeFile = file(releaseStoreFile)
        storePassword = releaseStorePassword
        keyAlias = signingProperty('pampa.keyAlias', 'pampa')
        keyPassword = (signingProperty('pampa.keyPassword') ?: releaseStorePassword)
        // Anche la firma v1 (JAR): il publisher del Pampa Store la cerca per dire "firmato" (vedi `signV1`).
        // Da Android 7.0 in su conta la v2; la v3 (Android 9+, il minSdk e' 29) porta la discendenza per ruotare la chiave un giorno
        // (`apksigner rotate`, D32) senza reinstallare. `tools/release/release.ps1` controlla che v2 e v3 ci siano e dice se c'e' la v1.
        enableV1Signing = signV1
        enableV2Signing = true
        enableV3Signing = true
      }
    }
  }

  buildTypes {
    debug {
      // Un suffisso, cosi' la build di lavoro (firmata con la chiave di debug) convive sul telefono con
      // la release firmata con pampa.jks: stesso id e firme diverse si rifiuterebbero a vicenda.
      applicationIdSuffix = '.debug'
      versionNameSuffix = '-debug'
      debuggable = true
      minifyEnabled = false
    }
    release {
      // R8 attivo: taglio del codice morto, ottimizzazione e restringimento delle risorse.
      // `debuggable false` e' esplicito (e' il default, ma e' proprio la riga che un controllo deve poter
      // trovare): verify-release-manifest.gradle e tools/check.ps1 falliscono se la release risultasse
      // debuggable.
      debuggable = false
      minifyEnabled = true
      shrinkResources = true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (hasReleaseKey) {
        signingConfig = signingConfigs.release
      }
    }
  }

  // L'app e' in italiano e basta (piano, §4 "Lingua"): le traduzioni portate dalle librerie non entrano.
  androidResources {
    localeFilters += ['it']
  }

  buildFeatures {
    compose = true
    buildConfig = true
  }

  lint {
    checkReleaseBuilds = true
  }

  packaging {
    resources {
      excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
      // Fase 2 (docs/fase2-progetto.md §3.1, riga R8): bcprov (dipendenza di smbj) porta un manifest OSGi
      // per Java 9 che collide con quello di un'altra libreria e non serve a niente su Android.
      excludes += ['/META-INF/versions/9/OSGI-INF/MANIFEST.MF']
    }
  }

  testOptions {
    unitTests.all {
      // Screenshot dello scaffold (Roborazzi), come in core-designsystem.
      maxHeapSize = '3g'
      // Fase 9 (orchestratore, 30/10): HiddenSurfacesRegistryTest legge i sorgenti di TUTTI i moduli (RepoFiles), anche di quelli da cui :app
      // non dipende (core-memories). Sono ingressi del test, come in core-common: senza, un file nuovo che nomina HiddenMask lasciava il
      // risultato "dalla cache" e il registro non lo vedeva.
      inputs.files(rootProject.file('settings.gradle'))
      inputs.files(fileTree(rootDir) {
        include '*/src/*/kotlin/**/*.kt'
        exclude 'engine/**', 'spike/**', '**/build/**'
      }).withPropertyName('galleryModuleSources')
    }
  }
}

// Fase 6 (P0, D38): nel manifest fuso di OGNI variante restano solo le `uses-native-library` ammesse (le due della GPU): litert-api
// ne dichiara 31 e il fusore di AGP non sa toglierle (gradle/verify-release-manifest.gradle, `FilterNativeLibraries`). Prima del
// controllo qui sotto, che legge l'artefatto gia' trasformato e lo ricontrolla.
androidComponents {
  onVariants(selector().all()) { variant ->
    variant.artifacts.use(registerNativeLibraryFilter(variant))
      .wiredWithFiles({ it.mergedManifest }, { it.updatedManifest })
      .toTransform(SingleArtifact.MERGED_MANIFEST.INSTANCE)
  }
}

// Fase 6 (P11, decisione dell'orchestratore, modifica a D3): la release e la `benchmarkRelease` portano solo `arm64-v8a` (tutti i
// dispositivi della famiglia sono arm64); `x86_64` (46 MB di librerie native) serve solo agli emulatori e resta nella debug e nella
// `nonMinifiedRelease` (generazione del profilo, anche sull'emulatore). tools/check.ps1 (passo 7e) lo controlla sull'APK di release.
//
// Fase 9 (P12): `-PbenchKeepX86=true` (lo mette `tools/check.ps1 -Bench` da solo su un emulatore x86_64) tiene `x86_64` nella SOLA `benchmarkRelease`: e'
// lo smoke sull'emulatore Medium_Phone (gli scenari girano, i numeri non valgono; docs/bench/README.md). Senza la proprieta' (la misura vera su S25 e Tab S9,
// e ogni altra build) non cambia niente; la release non ha mai x86_64, con o senza proprieta' (`tools/check.ps1`, passo 7e).
def benchKeepX86 = project.findProperty('benchKeepX86') == 'true'
androidComponents {
  onVariants(selector().all()) { variant ->
    if (variant.name == 'release' || (variant.name == 'benchmarkRelease' && !benchKeepX86)) {
      variant.packaging.jniLibs.excludes.add('**/x86_64/**')
    }
  }
}

// Controllo di sicurezza del manifest fuso di release (gradle/verify-release-manifest.gradle).
androidComponents {
  onVariants(selector().withBuildType('release')) { variant ->
    registerVerifyReleaseManifest(variant, variant.artifacts.get(SingleArtifact.MERGED_MANIFEST.INSTANCE))
  }
}

// Baseline Profile (D21, §2.6). Il profilo NON si genera durante il build: serve un dispositivo (S25) o l'emulatore
// Medium_Phone collegato, e `assembleRelease` deve riuscire anche senza (tools/check.ps1). Lo si genera a mano con
// `gradlew :app:generateBaselineProfile` e il file si committa; `check.ps1` verifica che la release lo contenga
// (`assets/dexopt/baseline.prof`) quando esiste nei sorgenti (P9).
//
// Le varianti `benchmarkRelease` (misura: R8 attivo, profilo applicato) e `nonMinifiedRelease` (generazione del profilo)
// le crea il plugin come cloni della release e ne riusano i sorgenti (`src/release/`: AppLogging e DeveloperTools senza
// sink di log ne' strumenti di sviluppo). `src/benchmarkRelease/` (P9) aggiunge l'inizializzatore del dataset sintetico di
// 100 mila righe, che non esiste in nessun'altra variante; `tools/check.ps1` verifica che la release non lo contenga.
baselineProfile {
  automaticGenerationDuringBuild = false
  saveInSrc = true
  // Le classi del dataset di misura (`src/benchmarkRelease`, compilate anche in `nonMinifiedRelease` da cui si genera il
  // profilo) non esistono nella release: le loro regole non servirebbero a niente e non devono stare nei sorgenti.
  filter {
    exclude("dev.pampa.mycloudgallery.bench.**")
  }
}

// Il plugin fa puntare il manifest di `benchmarkRelease` a quello di `src/release/` (che non c'e'): senza questa riga un
// `src/benchmarkRelease/AndroidManifest.xml` verrebbe ignorato. Serve a rimettere il ProfileInstallReceiver, che il
// manifest principale toglie da tutte le varianti, SOLO nella variante di misura. In finalizeDsl perche' il plugin
// crea il build type e imposta il percorso prima, e questo e' l'ultimo momento utile prima delle varianti.
//
// P11 (nota di P9, docs/bench/README.md §6):
// - `nonMinifiedRelease` (la variante di `:app:generateBaselineProfile`) riceve lo stesso `src/benchmarkRelease` (sorgenti e
//   manifest; il modulo Hilt `BenchHooksModule` che lega `MeasurementHooks` sta nei sorgenti): senza, il generatore ufficiale
//   del plugin non avrebbe il dataset ne' la famiglia "pronta". Niente `ServiceLoader` ne' `META-INF/services` (R6);
// - le due varianti di misura hanno un **id proprio** (`.bench`): sono firmate con la chiave di debug, e con lo stesso id
//   della release installarle sul telefono vero sostituirebbe l'app firmata cancellandone i dati.
androidComponents {
  finalizeDsl { extension ->
    extension.sourceSets.findByName('benchmarkRelease')?.manifest?.srcFile('src/benchmarkRelease/AndroidManifest.xml')
    extension.sourceSets.findByName('nonMinifiedRelease')?.with {
      manifest.srcFile('src/benchmarkRelease/AndroidManifest.xml')
      kotlin.srcDir('src/benchmarkRelease/kotlin')
    }
    ['benchmarkRelease', 'nonMinifiedRelease'].each { name ->
      extension.buildTypes.findByName(name)?.applicationIdSuffix = '.bench'
    }
  }
}

dependencies {
  // --- I moduli della galleria: l'app vede tutti -----------------------------------------------------
  implementation project(':core-common')
  implementation project(':core-model')
  implementation project(':core-database')
  implementation project(':core-designsystem') // porta con se' engine-ui (api)
  implementation project(':core-trust')
  implementation project(':core-security')
  implementation project(':core-rules')
  // Fase 2 (docs/fase2-progetto.md §1.1): l'app vede tutti i moduli nuovi e li cabla con Hilt.
  implementation project(':core-network')
  implementation project(':core-nas')
  implementation project(':core-family')
  implementation project(':core-qr')
  implementation project(':feature-onboarding')
  implementation project(':feature-settings')
  implementation project(':feature-diagnostics')
  // Fase 3 (docs/fase3-progetto.md §1.1): la galleria del telefono. `:app` vede tutti e li cabla.
  implementation project(':core-places')
  implementation project(':core-metadata')
  implementation project(':core-mediastore')
  implementation project(':core-imaging')
  implementation project(':core-library')
  implementation project(':feature-library')
  implementation project(':feature-viewer')
  // Fase 4A (docs/fase4-progetto.md §1.1, §1.4): il NAS nella Libreria. `:app` vede tutti e li cabla (NasGraph, P11).
  implementation project(':core-index')
  implementation project(':core-nasmedia')
  implementation project(':core-prepare')
  // Fase 4B (docs/fase4-progetto.md §1.1, §1.4): organizzare il NAS. `:app` cabla operazioni, cestino, spazio, dati personali e le
  // schermate (P16); le primitive di scrittura restano dentro core-nasops (`NasOpsWiring`), `:app` non le vede.
  implementation project(':core-nasops')
  implementation project(':core-personal')
  implementation project(':feature-nas')
  // Fase 5A (docs/fase5-progetto.md §1.1, §1.4): il backup. `:app` cabla il backup (BackupGraph, lavori, BackupJobService: P7); le
  // primitive in sola aggiunta restano dentro core-backup (`NasBackupOps`), `:app` non le vede. La recinzione del telefono in debug
  // (D13) sta in src/debug (`DeveloperTools`), mai nella release.
  implementation project(':core-backup')
  implementation project(':feature-backup')
  // Fase 5B (docs/fase5-progetto.md §1.1, §1.4, P0-B): le integrazioni con le altre app. Il manifest del modulo porta nell'app i QUATTRO
  // componenti approvati (Q5 (a)): PickerActivity, ShareReceiverActivity, MediaDocumentsProvider e FileProvider, scheletri che non agiscono
  // finche' P10 e P11 non li riempiono; l'elenco e' chiuso in `releaseManifestPolicy` e in docs/sicurezza.md §4-bis. `:app` lega le porte
  // (EntryGate, MediaDocuments) e lo sblocco dell'app alle activity d'ingresso in P14.
  implementation project(':feature-integrations')
  // Fase 6 (docs/fase6-progetto.md §1.1, §1.4, P0): la ricerca. `:app` cabla `AiGraph` e `SearchGraph` (P11): modelli, motori, calcolo
  // AI, motore di ricerca, la scheda Cerca al posto del segnaposto. litertlm, litert e ML Kit restano dentro core-ai (`:app` non le
  // nomina); il codice HTTPS resta dentro core-models (`internal`). Il manifest di core-ai toglie `MlKitInitProvider` dal manifest fuso.
  implementation project(':core-models')
  implementation project(':core-ai')
  implementation project(':core-search')
  implementation project(':feature-search')
  // Fase 7 (docs/fase7-progetto.md §1.1, §1.4, P13): gli album. `:app` cabla `AlbumsGraph` (album personali e smart, viaggi, album condivisi,
  // condivisione), le porte verso `NasOperations`, il backup (`INCOMING` verso la cartella dell'album, guardiano) e il catalogo, le schermate e i
  // lavori. core-albums non vede core-nasops ne' core-backup (Phase7ArchitectureTest): le porte che spostano o caricano le lega solo `:app`.
  implementation project(':core-albums')
  implementation project(':feature-albums')
  // Fase 8 (docs/fase8-progetto.md §1.1, §1.4, P13): le persone. `:app` cabla `FacesGraph` (interruttore, archivio cifrato, calcolo, raggruppamento,
  // sincronizzazione, cancellazione), le porte verso il catalogo, il buffer di analisi, la share privata del NAS, core-nasops, la ricerca e gli album, le
  // schermate e i lavori. core-faces non vede core-nasops, core-search, core-albums ne' la rete (Phase8ArchitectureTest): le porte le lega solo `:app`.
  implementation project(':core-faces')
  implementation project(':feature-people')
  // Fase 9 (docs/fase9-progetto.md §1.1, §1.4, P13): ricordi, notifiche e mappa. `:app` cabla `MemoriesGraph` (motore, scaffale, porte vere di viaggi,
  // persone, vettori, pixel, notifica) e `MapGraph` (punti, impostazioni, rete, traffico, MapLibre pigra con il client delle tessere installato prima), le
  // schermate, i lavori, la Diagnostica e l'azzeramento. MapLibre e OkHttp restano dentro feature-map (`MapLibreInit` e' l'unico ingresso, `:app` non nomina
  // `net/`); da qui i passi 7e e 7h di `tools/check.ps1` pretendono `libmaplibre.so` e il client delle tessere nell'APK di release.
  implementation project(':core-memories')
  implementation project(':feature-memories')
  implementation project(':core-map')
  implementation project(':feature-map')

  // --- Il design system (engine-ui porta Compose, Material 3, activity-compose e lifecycle) ----------
  implementation project(':engine-ui')

  // --- Hilt ---------------------------------------------------------------------------------------------
  implementation appDeps.hiltAndroid
  ksp appDeps.hiltCompiler
  ksp appDeps.hiltAndroidxCompiler // genera le factory dei @HiltWorker
  implementation appDeps.hiltNavigationCompose

  // --- Lavori in background (Fase 2: TrustSyncWorker di P9) ----------------------------------------------
  // Porta nel manifest SystemJobService (esportato, protetto da BIND_JOB_SERVICE: ammesso nella policy) e
  // DiagnosticsReceiver (esportato, tolto dal manifest dell'app); vedi verify-release-manifest.gradle.
  implementation appDeps.workRuntimeKtx
  implementation appDeps.hiltWork

  // --- Prestazioni (Fase 3, D21): il profilo e' generato da :benchmark (mai nell'APK) e installato all'avvio da
  // profileinstaller. Il ProfileInstallReceiver esportato resta TOLTO dal manifest di release (AndroidManifest.xml)
  // e torna solo nella variante benchmarkRelease (P9).
  baselineProfile project(':benchmark')
  implementation appDeps.profileInstaller

  // --- Archivi locali (P9): i DataStore delle regole e dei consumi li crea :app (AppGraph). Stessa libreria e stessa
  // versione che i moduli core-* usano gia' (nessun artefatto nuovo).
  implementation appDeps.datastorePreferences

  // --- Navigazione e stato -------------------------------------------------------------------------------
  implementation appDeps.navigationCompose
  implementation appDeps.lifecycleViewModelCompose
  implementation appDeps.lifecycleRuntimeKtx
  implementation appDeps.lifecycleRuntimeCompose
  implementation appDeps.coroutinesAndroid // Dispatchers.Main
  implementation appDeps.serializationCore // rotte @Serializable

  testImplementation appDeps.coroutinesTest
  testImplementation appDeps.turbine
  testImplementation appDeps.workTesting
  // Fase 10 (P7): la sonda DESCRIPTIONS del registro dei Nascosti fa girare il descrittore vero (e i fake delle sue porte). Il legame vero in :app e' di P13.
  testImplementation project(':core-describe')
  // Screenshot dello scaffold (docs/screenshots/2-P0/) e test Compose su JVM.
  testImplementation appDeps.robolectric
  testImplementation appDeps.androidxTestCore
  testImplementation appDeps.androidxTestExtJunit
  testImplementation platform("androidx.compose:compose-bom:${engine.composeBom}")
  testImplementation appDeps.composeUiTestJunit4
  // Niente ui-test-manifest: in un'app entra solo con debugImplementation, cioe' come activity esportata
  // nell'APK di debug. Lo screenshot test registra la ComponentActivity in Robolectric (vedi il test).
  testImplementation appDeps.roborazzi
  testImplementation appDeps.roborazziCompose
  testImplementation appDeps.roborazziJunitRule

  // Fase 6 (P0, D41): il test strumentato che prova, nel processo dell'app vera, che con la lettura del testo spenta ML Kit non si
  // inizializza (`MlKitOffAtStartupDeviceTest`). Solo l'APK di prova, mai l'app.
  androidTestImplementation appDeps.androidxTestCore
  androidTestImplementation appDeps.androidxTestExtJunit
  androidTestImplementation appDeps.androidxTestRunner
  androidTestImplementation appDeps.junit

  // Fase 7 (P12): lo strumento di valutazione degli album e dei viaggi (F88, F89) sta in src/debug e usa il motore degli album smart e `CatalogTrips` di
  // core-albums: da P13 il modulo e' `implementation` (sopra) e lo strumento resta solo nella build di debug (`check.ps1` lo cerca nel dex di release).
}
