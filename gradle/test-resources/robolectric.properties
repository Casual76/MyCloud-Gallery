# Configurazione di Robolectric per TUTTI i moduli (android-conventions.gradle aggiunge questa cartella
# alle risorse di test). Si esegue sull'SDK 35: l'SDK 36 richiede Java 21 e la toolchain dell'engine e'
# Java 17. Senza questa riga Robolectric prende il targetSdk (36), non puo' eseguire i test e il modulo
# risulta "passato" con ZERO test eseguiti.
sdk=35
