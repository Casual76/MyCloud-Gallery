// Le dipendenze PROPRIE dell'app, pre-dichiarate per tutta la Fase 1 (e, dal pacchetto P0, per tutta la
// Fase 2 e la Fase 3) cosi' i moduli in lavoro in parallelo non devono toccare versioni ne' coordinate:
// basta scrivere `implementation appDeps.xxx`.
//
// Quelle condivise con l'engine (Compose BOM, coroutines, DataStore, Navigation, Lifecycle, JUnit...)
// vivono in engine/versions.gradle e si leggono dalla mappa `engine`; qui sono rimappate in appDeps
// solo per dare un nome unico a chi le usa.
//
// Regole:
//   - versioni STABILI e FISSATE (mai `+`, mai `latest`, mai alpha/beta/rc);
//   - ogni versione nuova richiede di rigenerare gradle/verification-metadata.xml (vedi README);
//   - NIENTE librerie che non siano in questo elenco senza una riga in docs/sicurezza.md: niente
//     analytics, niente crash reporting, niente Qualcomm/NPU, niente SDK che parli con internet.
//     Eccezioni scritte (Fase 6, D49 di docs/fase6-progetto.md), tutte SOLO in :core-ai (test d'architettura):
//       * `litertlm-android` e `litert`: runtime on-device, nessuna rete attesa (lo verificano le catture F55 e F67);
//       * ML Kit `text-recognition` (versione integrata, modello nell'APK, niente Play Services): manda a Google
//         statistiche tecniche SOLO con la lettura del testo attiva, una funzione spenta di default che l'utente sceglie
//         dopo una pagina che dice cosa esce (risposta Q4, D41). Spenta, ML Kit non si inizializza: `MlKitInitProvider`
//         tolto dal manifest fuso, `MlKit.initialize` solo nel cancello di core-ai/.../ocr/.
//     L'unico codice HTTPS dell'app resta NOSTRO (`HttpsURLConnection` della piattaforma, nessuna libreria), in
//     core-models/.../download/https/ (D33): solo per scaricare i modelli fissati nell'app.
//
// Questo file si applica DOPO engine/versions.gradle (usa la mappa `engine`).

ext.appVersions = [
  // Il pavimento di minSdk e' in gradle.properties (engine.minSdk); il target e' una decisione di
  // prodotto (docs/android.md, "Android 17"): 36 finche' l'app non e' pronta per il permesso
  // ACCESS_LOCAL_NETWORK del target 37. NON segue engine.compileSdk di proposito.
  targetSdk              : 36,

  // Iniezione delle dipendenze. 2.58 = ultima compatibile con AGP 8.x (vedi build.gradle).
  hilt                   : '2.58',
  androidxHilt           : '1.3.0',          // hilt-work, hilt-navigation-compose, hilt-compiler (la 1.4 chiede AGP 9.1 / compileSdk 37)

  // Database. 2.8.5 DEVE combaciare con il plugin `androidx.room` di build.gradle.
  room                   : '2.8.5',

  // Lavori in background. 2.11.2 e' l'ultima che compila contro android-36: la 2.12 chiede un
  // compileSdk piu' alto di quello dell'engine.
  work                   : '2.11.2',

  // kotlinx. Le coroutines dell'engine sono la 1.8.1; Gradle prende comunque la piu' alta del grafo
  // (Room e WorkManager ne portano di piu' nuove), quindi le dichiariamo noi allo stesso livello.
  coroutines             : '1.10.2',
  serializationJson      : '1.9.0',

  // Blocco app con la credenziale di sistema (BiometricPrompt + DEVICE_CREDENTIAL), solo :core-security.
  // 1.1.0 e' l'UNICA versione stabile: la 1.2.x e la 1.4.x sono ancora alpha (regola: mai alpha).
  // Porta con se' fragment e appcompat (dipendenze di runtime della libreria).
  biometric              : '1.1.0',

  // Test (tutte solo testImplementation / androidTestImplementation).
  truth                  : '1.4.5',
  turbine                : '1.2.1',
  robolectric            : '4.17',
  androidxTestCore       : '1.7.0',
  androidxTestExtJunit   : '1.3.0',
  // Il runner degli instrumented test (AndroidJUnitRunner): ext:junit non lo porta. 1.7.0 e' allineato a
  // core 1.7.0 e monitor 1.8.0; solo androidTestImplementation (:core-security, piano 1.5).
  androidxTestRunner     : '1.7.0',
  // DEVE combaciare con il plugin `io.github.takahirom.roborazzi` di build.gradle.
  roborazzi              : '1.76.0',

  // --- Fase 2 (P0, docs/fase2-progetto.md; righe in docs/sicurezza.md §8) ------------------------------
  // SMB 3.1.1 con cifratura, solo :core-nas. La 0.15.0 e' quella provata contro il NAS vero dallo spike
  // (spike/nas-probe). Porta a runtime bcprov-jdk18on 1.85.2, mbassador 1.3.2, asn-one 0.6.0 e slf4j-api
  // 2.0.18, e NESSUN provider SLF4J: le sue righe di log non vanno da nessuna parte.
  smbj                   : '0.15.0',
  // Lettura e scrittura dei QR, solo :core-qr (D4). Solo il nucleo Java: niente zxing-android-embedded,
  // niente Play Services, niente ML Kit.
  zxing                  : '3.5.4',
  // Fotocamera dentro l'app per scansionare i QR (D4), solo :core-qr. La 1.5.3 e non la 1.6.x di proposito:
  // dalla 1.6 camera-camera2 porta camera-camera2-pipe e Dagger 2.59 a runtime, che scavalcherebbe il
  // Dagger 2.58 di Hilt (fissato da AGP 8, vedi build.gradle). Tre artefatti: camera2 (porta camera-core),
  // lifecycle e compose (il mirino in Compose, senza camera-view che porterebbe camera-video e appcompat).
  camerax                : '1.5.3',

  // --- Fase 3 (P0, docs/fase3-progetto.md §3.2; righe in docs/sicurezza.md §8) -------------------------------
  // Regola: l'ultima versione STABILE che compila con compileSdk 36, AGP 8.13.2 e Kotlin 2.2.20 (controllata
  // con aar-metadata.properties di ogni AAR: `minCompileSdk`). Una versione che chiede compileSdk 37 si scarta
  // e si scrive qui sotto il perche'. Nessuna alpha, beta o rc.
  //
  // EXIF, XMP, HEIF, DNG, solo :core-metadata (e :core-imaging per gli orientamenti). 1.4.2 (minCompileSdk 34).
  exifinterface          : '1.4.2',
  // Video e motion photo, solo :feature-viewer (D7). 1.11.1 e' l'ultima stabile e chiede compileSdk 36 (= il
  // nostro): nessuna scartata per l'SDK. Sorgenti SOLO locali (ContentDataSource): mai DefaultDataSource /
  // DefaultHttpDataSource (D24, vietati da un test). NON si aggiunge media3-ui-compose: anche la 1.11.1 e'
  // stabile, ma il suo POM importa il compose-bom 2026.05.00 (Compose 1.11.1) e alzerebbe per tutta l'app il
  // Compose dell'engine (BOM 2026.03.00, Compose 1.10.5, Material3 1.5.0-alpha16) senza che l'engine l'abbia
  // provato. La superficie del video e' una AndroidView(SurfaceView) di tre righe (D7 vuole comunque la
  // SurfaceView per l'HDR). Da rivalutare quando l'engine alza il BOM.
  media3                 : '1.11.1',
  // Zoom e tasselli, solo :feature-viewer (D6), avvolti in ZoomableMedia. 0.19.0 e' l'ultima stabile (le
  // 1.0.0-alphaNN sono alpha, scartate): Kotlin 2.1.21 e Compose 1.8.0, compatibili con Kotlin 2.2.20 e con
  // il Compose 1.10.5 dell'engine (stessa libreria, ABI stabile). Porta okio 3.11.0 e poko-annotations.
  telephoto              : '0.19.0',
  // Macrobenchmark e Baseline Profile, SOLO :benchmark e plugin di build: mai nell'APK (D21). Famiglia 1.4.x, l'ultima
  // che funziona con la nostra toolchain: il plugin `androidx.baselineprofile` 1.5.0 (stabile, compileSdk 34) SCARTATO
  // perche' per le varianti generate (benchmarkRelease, nonMinifiedRelease) aggiunge ai sorgenti Kotlin un percorso
  // sbagliato (`app/provider(?)`, un Provider convertito in stringa) e KSP 2.2.20-2.0.4 fallisce con InvalidPathException
  // (`kspBenchmarkReleaseKotlin`); la 1.4.1 aggiunge `src/release/kotlin` correttamente. Con il plugin alla 1.4.1 anche
  // benchmark-macro-junit4 resta alla 1.4.1 (stessa famiglia) e uiautomator alla 2.3.0 (quella con cui la 1.4.1 e'
  // uscita); la 1.5.0 e la uiautomator 2.4.0 sono stabili e compilano con compileSdk 36, da riprovare INSIEME quando il
  // plugin 1.5.x sistema il bug (le 1.6.0-alpha restano scartate). Il plugin DEVE avere la stessa versione qui e in
  // build.gradle.
  benchmarkMacro         : '1.4.1',
  uiautomator            : '2.3.0',
  baselineProfile        : '1.4.1',
  // Lo legge il plugin del profilo (e Compose lo porta gia' a runtime): lo dichiariamo noi alla versione stabile.
  profileInstaller       : '1.4.1',

  // --- Fase 6 (P0, docs/fase6-progetto.md D2, D12, D38, D44, D49; righe in docs/sicurezza.md §8) ----------------------------
  // Tutte e tre SOLO in :core-ai (Phase6ArchitectureTest): nessun altro build.gradle le nomina. Approvate dall'utente il 21/10.
  // Motore dei vettori (EmbeddingGemma 2), Apache 2.0, nativo (`liblitertlm_jni.so`, arm64-v8a e x86_64). La 0.18.1 (20/10/2026)
  // corregge un'incompatibilita' ABI di EmbeddingGemma 2. E' compilata con Kotlin 2.4: :core-ai la legge con
  // `-Xskip-metadata-version-check` (solo li') e le sue transitive (kotlin-reflect, coroutines) sono decise in core-ai/build.gradle.
  litertlm               : '0.18.1',
  // OCR (lettura del testo nelle foto), versione integrata con il modello latino nell'APK, niente Play Services (D12). Termini ML
  // Kit. 16.0.1 (07/08/2024) e' ancora l'ultima. Parla con Google SOLO con la lettura del testo attiva (D41, eccezione D49).
  mlkitTextRecognition   : '16.0.1',
  // Runtime LiteRT (ex TensorFlow Lite) per il ritaglio del soggetto con MagicTouch (D44), Apache 2.0, nativo. NON MediaPipe Tasks
  // (statistiche d'uso annunciate senza modo di spegnerle). Convive con litertlm-android nello stesso processo (test strumentato di P0).
  litert                 : '2.3.0',
]

ext.appSdk = [
  targetSdk: appVersions.targetSdk,
]

// Coordinate pronte da usare nei moduli. Le chiavi `ksp*` vanno nella configurazione `ksp`.
ext.appDeps = [
  // --- Hilt ---------------------------------------------------------------------------------------
  hiltAndroid              : "com.google.dagger:hilt-android:${appVersions.hilt}",
  hiltCompiler             : "com.google.dagger:hilt-android-compiler:${appVersions.hilt}",       // ksp
  hiltWork                 : "androidx.hilt:hilt-work:${appVersions.androidxHilt}",
  hiltNavigationCompose    : "androidx.hilt:hilt-navigation-compose:${appVersions.androidxHilt}",
  hiltAndroidxCompiler     : "androidx.hilt:hilt-compiler:${appVersions.androidxHilt}",           // ksp, per @HiltWorker

  // --- Room ---------------------------------------------------------------------------------------
  roomRuntime              : "androidx.room:room-runtime:${appVersions.room}",
  roomKtx                  : "androidx.room:room-ktx:${appVersions.room}",
  roomCompiler             : "androidx.room:room-compiler:${appVersions.room}",                   // ksp
  roomTesting              : "androidx.room:room-testing:${appVersions.room}",

  // --- DataStore, WorkManager, Navigation, Lifecycle (versioni dell'engine dove ci sono) --------------
  datastorePreferences     : "androidx.datastore:datastore-preferences:${engine.datastore}",
  workRuntimeKtx           : "androidx.work:work-runtime-ktx:${appVersions.work}",
  workTesting              : "androidx.work:work-testing:${appVersions.work}",
  navigationCompose        : "androidx.navigation:navigation-compose:${engine.navigation}",
  lifecycleRuntimeKtx      : "androidx.lifecycle:lifecycle-runtime-ktx:${engine.lifecycle}",
  lifecycleRuntimeCompose  : "androidx.lifecycle:lifecycle-runtime-compose:${engine.lifecycle}",
  lifecycleViewModelCompose: "androidx.lifecycle:lifecycle-viewmodel-compose:${engine.lifecycle}",

  // --- Sicurezza (solo :core-security) ----------------------------------------------------------------
  biometric                : "androidx.biometric:biometric:${appVersions.biometric}",

  // --- kotlinx --------------------------------------------------------------------------------------
  coroutinesCore           : "org.jetbrains.kotlinx:kotlinx-coroutines-core:${appVersions.coroutines}",
  coroutinesAndroid        : "org.jetbrains.kotlinx:kotlinx-coroutines-android:${appVersions.coroutines}",
  coroutinesTest           : "org.jetbrains.kotlinx:kotlinx-coroutines-test:${appVersions.coroutines}",
  serializationJson        : "org.jetbrains.kotlinx:kotlinx-serialization-json:${appVersions.serializationJson}",
  // Le rotte @Serializable della navigazione (Fase 2): navigation-common non espone il runtime nelle sue API.
  serializationCore        : "org.jetbrains.kotlinx:kotlinx-serialization-core:${appVersions.serializationJson}",

  // --- AndroidX core (versione dell'engine; lo porta gia' engine-ui) ------------------------------------
  // Per i moduli senza engine-ui che leggono Android con le API compat (core-rules: salute del background).
  coreKtx                  : "androidx.core:core-ktx:${engine.coreKtx}",

  // --- Fase 2: NAS, QR, fotocamera ---------------------------------------------------------------------
  smbj                     : "com.hierynomus:smbj:${appVersions.smbj}",
  zxingCore                : "com.google.zxing:core:${appVersions.zxing}",
  cameraCamera2            : "androidx.camera:camera-camera2:${appVersions.camerax}",
  cameraLifecycle          : "androidx.camera:camera-lifecycle:${appVersions.camerax}",
  cameraCompose            : "androidx.camera:camera-compose:${appVersions.camerax}",

  // --- Fase 3: metadati, video, zoom, immagini, prestazioni ----------------------------------------------
  exifinterface            : "androidx.exifinterface:exifinterface:${appVersions.exifinterface}",
  media3Exoplayer          : "androidx.media3:media3-exoplayer:${appVersions.media3}",
  telephotoZoomableImage   : "me.saket.telephoto:zoomable-image:${appVersions.telephoto}",
  telephotoSubSampling     : "me.saket.telephoto:sub-sampling-image:${appVersions.telephoto}",
  // Versione dal BOM dell'engine (platform): qui solo le coordinate senza versione. ImageBitmap nelle API di
  // :core-imaging; runtime-annotation per @Immutable/@Stable sui tipi di :core-library (modulo senza Compose).
  composeUiGraphics        : "androidx.compose.ui:ui-graphics",
  // `State` e `mutableStateOf` nelle API di :core-imaging (ui-graphics tiene il runtime come implementation).
  composeRuntime           : "androidx.compose.runtime:runtime",
  composeRuntimeAnnotation : "androidx.compose.runtime:runtime-annotation",
  // SOLO :benchmark (e :app per il profilo): mai nell'APK di release.
  benchmarkMacroJunit4     : "androidx.benchmark:benchmark-macro-junit4:${appVersions.benchmarkMacro}",
  uiautomator              : "androidx.test.uiautomator:uiautomator:${appVersions.uiautomator}",
  profileInstaller         : "androidx.profileinstaller:profileinstaller:${appVersions.profileInstaller}",

  // --- Fase 6: motori on-device (SOLO :core-ai, Phase6ArchitectureTest) ---------------------------------------------------
  litertlmAndroid          : "com.google.ai.edge.litertlm:litertlm-android:${appVersions.litertlm}",
  mlkitTextRecognition     : "com.google.mlkit:text-recognition:${appVersions.mlkitTextRecognition}",
  litert                   : "com.google.ai.edge.litert:litert:${appVersions.litert}",

  // --- Test ---------------------------------------------------------------------------------------
  junit                    : "junit:junit:${engine.junit}",
  truth                    : "com.google.truth:truth:${appVersions.truth}",
  turbine                  : "app.cash.turbine:turbine:${appVersions.turbine}",
  robolectric              : "org.robolectric:robolectric:${appVersions.robolectric}",
  androidxTestCore         : "androidx.test:core:${appVersions.androidxTestCore}",
  androidxTestExtJunit     : "androidx.test.ext:junit:${appVersions.androidxTestExtJunit}",
  androidxTestRunner       : "androidx.test:runner:${appVersions.androidxTestRunner}",
  roborazzi                : "io.github.takahirom.roborazzi:roborazzi:${appVersions.roborazzi}",
  roborazziCompose         : "io.github.takahirom.roborazzi:roborazzi-compose:${appVersions.roborazzi}",
  roborazziJunitRule       : "io.github.takahirom.roborazzi:roborazzi-junit-rule:${appVersions.roborazzi}",
  // Compose UI test: versione dal BOM dell'engine (platform), qui solo le coordinate senza versione.
  composeUiTestJunit4      : "androidx.compose.ui:ui-test-junit4",
  composeUiTestManifest    : "androidx.compose.ui:ui-test-manifest",
]
