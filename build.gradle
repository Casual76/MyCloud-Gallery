tasks.register('galleryTest') {
  group = 'verification'
  description = 'Unit test (debug) di tutti i moduli della galleria, engine escluso.'
  dependsOn galleryModules.collect { "${it}:testDebugUnitTest" }
}

tasks.register('galleryLint') {
  group = 'verification'
  description = 'Android lint (debug) di tutti i moduli della galleria, engine escluso.'
  dependsOn galleryModules.collect { "${it}:lintDebug" }
}
