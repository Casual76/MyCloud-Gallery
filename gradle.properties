org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096m

# Il pavimento di minSdk lo decide l'app, non l'engine: engine/versions.gradle prende il massimo fra
# il proprio (26) e questo valore. 29 = Android 10, il telefono e il tablet di famiglia
# (vedi docs/decisioni.md: nessun percorso NPU, quindi il 31 non serve).
engine.minSdk=29
