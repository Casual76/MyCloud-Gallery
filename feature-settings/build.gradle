// Impostazioni, famiglia e dispositivi (Fase 2: scheletro P0, schermate P7; docs/fase2-progetto.md §2.2
// lato admin e §2.3). Solo UI: registro, approvazioni e ciclo di vita sono di core-family (P3, P4).
//
// D7: @HiltViewModel (KSP); rotte @Serializable; nessun altro feature come dipendenza (la Diagnostica e
// la ripresa di un passo dell'onboarding arrivano come callback da :app).
plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'org.jetbrains.kotlin.plugin.serialization'
  id 'com.google.devtools.ksp'
  id 'com.google.dagger.hilt.android'
  id 'io.github.takahirom.roborazzi'
}

apply from: "${rootDir}/engine/versions.gradle"
apply from: "${rootDir}/versions-app.gradle"
apply from: "${rootDir}/gradle/android-conventions.gradle"

android {
  namespace = 'dev.pampa.mycloudgallery.feature.settings'

  buildFeatures {
    compose = true
  }

  testOptions {
    unitTests.all {
      maxHeapSize = '3g'
    }
  }
}

dependencies {
  implementation project(':core-family')
  implementation project(':core-network')
  implementation project(':core-nas')
  implementation project(':core-qr')
  implementation project(':core-security')
  implementation project(':core-rules')
  implementation project(':core-designsystem')
  // Fase 5A (P0, docs/fase5-progetto.md §1.3): la voce "Backup" delle Impostazioni (`backup/**`, P5) con lo stato del backup
  // (`BackupStatus`, core-backup/contract); la pagina e' di feature-backup, che si apre con una callback di :app.
  implementation project(':core-backup')

  implementation appDeps.hiltAndroid
  ksp appDeps.hiltCompiler
  implementation appDeps.hiltNavigationCompose
  implementation appDeps.navigationCompose
  implementation appDeps.lifecycleViewModelCompose
  implementation appDeps.lifecycleRuntimeCompose
  implementation appDeps.serializationCore

  // Fase 10 (P3): i codici delle scelte del widget coincidono con quelli di `core-widget` (`WidgetSettingsScreenTest`). Solo nei test: in produzione le Impostazioni non vedono `core-widget`.
  testImplementation project(':core-widget')

  testImplementation appDeps.coroutinesTest
  testImplementation appDeps.turbine
  testImplementation appDeps.robolectric
  testImplementation appDeps.androidxTestCore
  testImplementation appDeps.androidxTestExtJunit
  testImplementation platform("androidx.compose:compose-bom:${engine.composeBom}")
  testImplementation appDeps.composeUiTestJunit4
  testImplementation appDeps.composeUiTestManifest
  testImplementation appDeps.roborazzi
  testImplementation appDeps.roborazziCompose
  testImplementation appDeps.roborazziJunitRule
  // Fase 10 P8 (D28): il controllo ATF sugli screenshot, solo nei test (mai nel dex).
  testImplementation appDeps.roborazziAccessibilityCheck
}
