  // non finisce mai nell'APK (tools/check.ps1 lo esclude dal controllo "test eseguiti").
  ':core-places',
  ':core-metadata',
  ':core-mediastore',
  ':core-imaging',
  ':core-library',
  ':feature-library',
  ':feature-viewer',
  // Fase 4A (docs/fase4-progetto.md §1.1)
  ':core-index',
