// Il manifest di rilascio firmato della Fase 10 (docs/fase10-progetto.md §1.1, §1.2 "core-release", §2.8, D29-D31; Q8 (a): si legge solo dal
// NAS). Formato canonico e tetti (codec/, P1), firma P-256 con le due chiavi fissate (keys/, P1), stato dei blocchi solo piu' severo,
// anti-rigioco, scadenza e indirizzi aggiuntivi dei modelli (state/, P1). Contratti, null-object, fake ed esecutori di riferimento
// (`InMemoryReleaseState`, `TableManifestVerifier`, `InMemoryReleaseStateStore`, `FakeManifestSource`) di P0.
//
// **JVM puro** (D2): nessuna classe Android, **nessuna rete** (ne' java.net ne' client HTTP: il file arriva da `ManifestSource`, che :app lega
// alla sessione del NAS), nessun NAS, nessun orologio del telefono (la scadenza si giudica con `ReleaseClock.bestNow`, l'ora del NAS quando
// c'e'). Vede solo le fondamenta: non vede core-models (gli indirizzi aggiuntivi escono come testo e li valida :app con `PinnedUrl.of` e il
// catalogo), ne' core-nas, ne' core-trust (le chiavi del manifest non sono quelle della famiglia: firme con `java.security`). Nessun Hilt.
plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

apply from: "${rootDir}/engine/versions.gradle"
apply from: "${rootDir}/versions-app.gradle"
apply from: "${rootDir}/gradle/android-conventions.gradle"

android {
  namespace = 'dev.pampa.mycloudgallery.core.release'

  // P1: lo strumento dell'admin (`tools/release/ManifestTool`, D31, §2.8) si compila con i TEST di questo modulo: usa lo stesso codec e lo
  // stesso verificatore dell'app, la chiave di prova KT (privata solo in src/test/) e non entra mai in un APK (i test non ci vanno; in piu'
  // `tools/check.ps1` passo 7b). Le sue prove girano con galleryTest.
  sourceSets {
    test {
      java.srcDir "${rootDir}/tools/release/ManifestTool/src"
      java.srcDir "${rootDir}/tools/release/ManifestTool/test"
    }
  }
}

dependencies {
  api project(':core-common')
  api project(':core-model')

  testImplementation appDeps.coroutinesTest
  testImplementation appDeps.turbine
}

// --- Lo strumento del manifest (P1; docs/decisioni.md, "Fase 10 P1") ------------------------------------------------------------------
//
//   gradlew :core-release:manifestToolClasspath     compila lo strumento e scrive il classpath in build/manifest-tool/classpath.txt
//
// Si lancia con `tools/release/manifest-tool.ps1 <comando>` (java diretto: la frase segreta si legge dalla console, che Gradle non da').
// Non fa parte di nessun build normale e non scarica niente.
afterEvaluate {
  tasks.register('manifestToolClasspath') {
    group = 'release'
    description = 'Compila ManifestTool (tools/release) con i test di core-release e ne scrive il classpath.'
    def unitTest = tasks.named('testDebugUnitTest').get()
    dependsOn unitTest.classpath
    def out = layout.buildDirectory.file('manifest-tool/classpath.txt')
    outputs.file(out)
    outputs.upToDateWhen { false }
    doLast {
      def file = out.get().asFile
      file.parentFile.mkdirs()
      file.text = unitTest.classpath.files.collect { it.absolutePath }.join(File.pathSeparator)
    }
  }
}
