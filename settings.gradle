pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = "MyCloudGallery"

include ':app'

// I moduli della galleria. Il grafo delle dipendenze e' nel README.md: nessun ciclo, `core-common` e
// `core-model` sono le foglie, `:app` vede tutti.
include ':core-common'       // logger interno, dispatcher, utilita' comuni
include ':core-model'        // tipi di dominio (media, posizioni, versioni, dispositivi)
include ':core-database'     // Room: replica locale dell'indice
include ':core-designsystem' // tema Ametista e componenti della galleria sopra engine-ui
include ':core-trust'        // formato e firme dei dati sul NAS
include ':core-security'     // credenziali, blocco app, protezioni dello schermo
include ':core-rules'        // motore delle regole delle attivita'

// Fase 2 (docs/fase2-progetto.md §1.1): rete e NAS, famiglia, QR e le tre funzioni con UI.
include ':core-network'      // stato della rete, casa, VPN, cancello del percorso verso il NAS
include ':core-nas'          // sessione SMB (smbj) e NasFileSystem reale
include ':core-family'       // fiducia operativa e flussi di famiglia (solo logica)
include ':core-qr'           // generazione e scansione dei QR (ZXing core + CameraX)
include ':feature-onboarding'  // schermate della configurazione iniziale
include ':feature-settings'    // impostazioni, famiglia e dispositivi
include ':feature-diagnostics' // diagnostica locale ed esportazione senza dati personali

// Fase 3 (docs/fase3-progetto.md §1.1): la galleria del telefono. Nessun modulo usa la rete (D24).
include ':core-places'       // luoghi offline (GeoNames, CC BY 4.0) e fusi orari
include ':core-metadata'     // date, tipi, EXIF, XMP, motion photo, ThumbHash
include ':core-mediastore'   // lettura e sincronizzazione del MediaStore del telefono
include ':core-imaging'      // miniature, decodifica, segnaposto
include ':core-library'      // indice della timeline, layout, filtri, selezione, contratto con il viewer
include ':feature-library'   // Libreria e Raccolte
include ':feature-viewer'    // il viewer (sovrapposizione)
include ':benchmark'         // Macrobenchmark e Baseline Profile (com.android.test, mai nell'APK)

// Fase 4A (docs/fase4-progetto.md §1.1): il NAS in sola lettura nella Libreria. Nessun modulo nuovo apre socket: SMB
// solo dai contratti di core-nas (D28).
include ':core-index'        // indice condiviso: pubblicazione, unita' di lavoro, replica locale, qualita'
include ':core-nasmedia'     // scansione del NAS, rilevamento, esclusioni, congelamento
include ':core-prepare'      // preparazione: miniature, anteprime, fotogrammi, hash completi (anche per la Fase 5)

// Fase 4B (docs/fase4-progetto.md §1.1, P0-B): organizzare il NAS. core-nasops e' l'UNICO modulo con operazioni distruttive sui file
// del NAS (l'unico che vede NasFileOps): ci si entra solo da una conferma dell'utente o dal diario locale.
include ':core-nasops'       // operazioni sui file del NAS, cestino, spazio, pulizia dei propri file, diario e conferme
include ':core-personal'     // dati personali sincronizzati fra i miei dispositivi
include ':feature-nas'       // Cartelle NAS, Spazio NAS, Eliminati di recente del NAS, Operazioni in corso

// Fase 5A (docs/fase5-progetto.md §1.1, P0): il backup. core-backup vede il NAS SOLO con le primitive in sola aggiunta
// (`NasBackupOps`, marcatore `AppendOnlyNasAccess`): non vede core-nasops, `NasFileOps` ne' core-mediastore (i byte del telefono
// arrivano da una porta). Nessun modulo che legge il NAS o mostra la Libreria vede core-backup.
include ':core-backup'       // piano, caricamento (diario e macchina a stati), verifiche, deduplica, guardiano, stato
include ':feature-backup'    // impostazioni e pagina del backup, primo backup (5B: versioni, Libera spazio, attivita' in sospeso)

// Fase 5B (docs/fase5-progetto.md §1.1, P0-B): le integrazioni con le altre app. Vede core-backup, la Libreria, le miniature e i contratti di
// core-mediastore, ma NON core-nas ne' core-nasops: i byte di un media solo-NAS arrivano da una porta che :app lega a NasMediaReader. Ha i
// quattro componenti approvati (Q5): PickerActivity, ShareReceiverActivity, MediaDocumentsProvider e FileProvider, come scheletri.
include ':feature-integrations' // selettore per le altre app, provider dei documenti, ricezione delle condivisioni, "Modifica con..."

// Fase 6 (docs/fase6-progetto.md §1.1, P0): la ricerca. core-models e' l'UNICO modulo con codice HTTPS (solo download/https/, per
// i modelli fissati nell'app); litertlm, litert e ML Kit stanno SOLO in core-ai; core-search non vede ne' rete ne' NAS. Chi legge il
// NAS o mostra la Libreria non vede nessuno dei quattro.
include ':core-models'       // catalogo dei modelli, sorgenti, scaricamento con ripresa, verifica, spazio, copia sul NAS
include ':core-ai'           // motori on-device (vettori, OCR solo se attivo, ritaglio), ingressi, calcolo AI coordinato
include ':core-search'       // indice locale, analizzatore delle query, fusione e soglie, simili, copertura, cronologia
include ':feature-search'    // la schermata Cerca e la pagina Ricerca e modelli

// --- fluid-engine (inizio) ---
def engineDir = file('engine')
if (engineDir.exists()) {
  [
   'engine-foundation',
   'engine-ui'
  ].each { name ->
    include ":$name"
    project(":$name").projectDir = new File(engineDir, name)
  }
}
// --- fluid-engine (fine) ---
