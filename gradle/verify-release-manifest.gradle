// Controllo di sicurezza del manifest di release (piano 1.1 e 1.5, docs/sicurezza.md C14/C16/C17/C22).
//
// Si applica da :app. Registra `verifyReleaseManifest`, che legge il manifest FUSO della release (quello
// che finisce nell'APK, con i manifest di tutte le librerie dentro) e FALLISCE il build se:
//   - la release e' debuggable;
//   - allowBackup non e' "false", o mancano dataExtractionRules (backup cloud e Smart Switch);
//   - il traffico in chiaro non e' vietato;
//   - un componente e' esportato (o ha un intent-filter senza `exported` esplicito) e non e' nell'elenco
//     `allowedExported` (la launcher activity e, dalla Fase 2, il JobService di WorkManager): nessun
//     servizio, receiver o provider di una libreria deve restare esposto in silenzio;
//   - un componente ammesso perche' protetto (`exportedRequiresPermission`) non dichiara quel permesso;
//   - c'e' un componente vietato in release (`forbiddenComponents`): dalla Fase 3, il ProfileInstallReceiver del
//     profilo di benchmark (torna solo nella variante benchmarkRelease, che non passa da questo controllo);
//   - c'e' un permesso Android che non e' nell'elenco qui sotto, o uno di quelli che l'app ha deciso di non chiedere mai
//     (`forbiddenPermissions`, dalla Fase 5B: `MANAGE_MEDIA` e l'accesso a tutti i file, D19);
//   - un permesso con un tetto di SDK (`permissionMaxSdk`) non dichiara quel `android:maxSdkVersion`;
//   - un servizio il cui nome finisce per `JobService` non e' protetto da `android.permission.BIND_JOB_SERVICE` (Fase 4B, D29: il
//     JobService delle operazioni lunghe sui file del NAS non e' esportato e solo il sistema puo' legarlo);
//   - (Fase 6, D38, D41) c'e' una `uses-native-library` che non e' fra le due della GPU (`allowedNativeLibraries`), o una di quelle
//     non e' facoltativa; c'e' `MlKitInitProvider` (ML Kit partirebbe da solo all'avvio del processo); un componente di ML Kit, di
//     DataTransport, dei Play services, di Firebase, di Play o di LiteRT (`thirdPartyComponentPrefixes`) non e' nell'elenco chiuso
//     `allowedThirdPartyComponents` o e' esportato: una versione nuova di una libreria che aggiunge un componente (che potrebbe
//     avviarsi da solo e mandare statistiche con la lettura del testo spenta, L49) fa fallire il build.
//
//   - (Fase 10, P4, D14-D17) la `MainActivity` non ha le impostazioni delle finestre (`mainActivityPolicy`): `launchMode`
//     (`singleInstancePerTask`, o il piano B `singleTask` dichiarato in docs/decisioni.md), i `configChanges` di D14 (rotazione, ridimensionamento,
//     tastiera, puntatore: ricomposizione, non ricreazione) e **nessuno di quelli che devono ricreare** (densita', lingua, tema: una ricreazione vera
//     deve poter ricostruire lo stato, e il blocco app non la conta come uscita), `resizeableActivity="true"`, `<layout>` con la misura minima 320 x 400 dp,
//     `taskAffinity` vuota (StrandHogg, F13).
//
//   - (Fase 10, P3, D6, D8, D10, D40, Q4 (a)) il widget: il ricevitore (`widgetPolicy`) e' uno solo, non esportato, e i suoi file `appwidget-provider`
//     dichiarano **solo la Home** (`widgetCategory="home_screen"`, mai `keyguard`) e `updatePeriodMillis="0"`; i componenti di Glance (`androidx.glance.`) sono
//     l'elenco chiuso `allowedThirdPartyComponents`, tutti non esportati: l'unico che Glance dichiara esportato, `GlanceRemoteViewsService` (le liste, che il
//     widget non usa), si **toglie** dal manifest fuso (`droppedLibraryComponents`) prima di questo controllo.
//
// `assembleRelease` dipende dal controllo: un APK che non lo passa non si produce nemmeno.
//
// Per ammettere un nuovo componente esportato o un nuovo permesso NON basta aggiungere una riga qui:
// prima serve una riga in docs/sicurezza.md (§4 per le contromisure, §4-bis per i permessi) con il
// perche'. L'elenco e' il punto in cui la decisione diventa visibile in una revisione.

ext.releaseManifestPolicy = [
  // Gli unici componenti che possono essere esportati (nome di classe completo, come nel manifest fuso).
  allowedExported  : [
    'dev.pampa.mycloudgallery.MainActivity',
    // WorkManager (Fase 2, P0): il sistema lega il JobService di WorkManager per eseguire i lavori. E'
    // esportato per forza (lo lega il sistema), ma solo chi ha BIND_JOB_SERVICE (cioe' il sistema stesso)
    // puo' farlo: il controllo qui sotto pretende quel permesso sul componente. docs/sicurezza.md §8.
    'androidx.work.impl.background.systemjob.SystemJobService',
    // Fase 5B (P0-B, D29, risposta Q5 (a) dell'utente del 15/10/2026): i TRE componenti nuovi esportati, di `:feature-integrations`. Le due
    // activity sono porte d'ingresso d'altre app (selettore: solo GET_CONTENT e PICK; ricezione: solo SEND e SEND_MULTIPLE, di immagini e
    // video) e nel P0-B sono scheletri che chiudono con RESULT_CANCELED senza leggere l'intento; il provider dei documenti e' protetto da
    // MANAGE_DOCUMENTS (qui sotto). Il FileProvider NON e' esportato e non compare in questo elenco. Righe in docs/sicurezza.md §4-bis.
    'dev.pampa.mycloudgallery.feature.integrations.picker.PickerActivity',
    'dev.pampa.mycloudgallery.feature.integrations.receive.ShareReceiverActivity',
    'dev.pampa.mycloudgallery.feature.integrations.provider.MediaDocumentsProvider',
  ],
  // Per i componenti esportati qui sopra che devono essere protetti: il permesso che il componente DEVE
  // dichiarare (android:permission). Senza, o con un altro, il manifest non passa.
  exportedRequiresPermission: [
    'androidx.work.impl.background.systemjob.SystemJobService': 'android.permission.BIND_JOB_SERVICE',
    // Fase 5B (P0-B): il provider dei documenti lo interroga solo il sistema (DocumentsUI), mai un'altra app: MANAGE_DOCUMENTS e' un permesso
    // `signature` del sistema. Senza, un'app qualunque potrebbe elencare e aprire i media dell'utente.
    'dev.pampa.mycloudgallery.feature.integrations.provider.MediaDocumentsProvider': 'android.permission.MANAGE_DOCUMENTS',
  ],
  // Permessi ammessi nel manifest fuso. {applicationId} e' sostituito con l'id dell'app.
  allowedPermissions: [
    // Aggiunto in automatico da androidx.core: protegge i receiver registrati a runtime, e' un
    // permesso `signature` proprio dell'app, non un accesso a qualcosa del telefono.
    '{applicationId}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION',
    // Portato da engine-ui (l'aptica di Fluid): permesso "normale", senza richiesta all'utente, che
    // permette solo di far vibrare il telefono. Da registrare in docs/sicurezza.md §4-bis.
    'android.permission.VIBRATE',
    // Da :core-security (piano 1.5), entrambi "normali" e senza richiesta all'utente; docs/sicurezza.md 4-bis.
    // Window.setHideOverlayWindows(true): difesa dal tapjacking sulle conferme e sulla password.
    'android.permission.HIDE_OVERLAY_WINDOWS',
    // BiometricPrompt con la credenziale di sistema (blocco app opzionale).
    'android.permission.USE_BIOMETRIC',

    // --- Fase 2 (P0). Righe in docs/sicurezza.md 4-bis (le nuove sono "proposta" finche' l'utente non le
    // approva, docs/fase2-progetto.md §6) e una riga riassuntiva in §8. -------------------------------------
    // :core-network: socket verso l'IP del NAS (SMB, sonda TCP, Wake-on-LAN). Normale.
    'android.permission.INTERNET',
    // :core-network e :app (motore delle regole): leggere le reti, senza posizione. Normale.
    'android.permission.ACCESS_NETWORK_STATE',
    // :core-network: accendere e spegnere il tunnel di casa in WireGuard. "Pericoloso", facoltativo (passo 11).
    'com.wireguard.android.permission.CONTROL_TUNNELS',
    // :core-qr: la fotocamera dentro l'app per i QR (D4). Pericoloso, chiesto all'apertura dello scanner.
    'android.permission.CAMERA',
    // :app: notifiche (problemi del NAS, approvazioni). Runtime, facoltativo (passo 9).
    'android.permission.POST_NOTIFICATIONS',
    // :app: richiesta diretta "Batteria illimitata" (passo 10). Normale; decide l'utente nel dialogo.
    'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
    // :app: foto e video del telefono, anche solo quelli selezionati (passo 9).
    'android.permission.READ_MEDIA_IMAGES',
    'android.permission.READ_MEDIA_VIDEO',
    'android.permission.READ_MEDIA_VISUAL_USER_SELECTED',
    // :app: posizione DENTRO i media (copia fedele, hash uguale). Non e' la posizione del telefono.
    'android.permission.ACCESS_MEDIA_LOCATION',
    // WorkManager (dichiarati dalla libreria): tenere sveglio il telefono durante un lavoro, ripianificare i
    // lavori dopo un riavvio, eseguirli come servizio in primo piano quando serve. Tutti normali.
    'android.permission.WAKE_LOCK',
    'android.permission.RECEIVE_BOOT_COMPLETED',
    'android.permission.FOREGROUND_SERVICE',

    // --- Fase 3 (P0, docs/fase3-progetto.md D22, **proposta**): riga in docs/sicurezza.md 4-bis. -----------------
    // :app: lettura dei media su Android 10-12 (SDK 29-32), dove READ_MEDIA_* non esiste. Solo con
    // android:maxSdkVersion="32" (vedi `permissionMaxSdk`): da Android 13 non e' nemmeno dichiarato.
    'android.permission.READ_EXTERNAL_STORAGE',

    // --- Fase 4B (P0-B, docs/fase4-progetto.md D29, approvato dall'utente il 15/10): riga in docs/sicurezza.md 4-bis. -------------
    // :app: le operazioni lunghe sui file del NAS avviate da un tocco girano come lavoro avviato dall'utente (UIDT, Android 14+)
    // nel JobService dell'app (NasOpsJobService: non esportato, protetto da BIND_JOB_SERVICE, vedi `verify`). Normale.
    // Fase 5A (P7, D11): lo stesso permesso serve al backup avviato dall'utente ("Inizia ora", "Fai ora") nel BackupJobService, con le
    // stesse due garanzie (non esportato, BIND_JOB_SERVICE: `verify` le pretende per ogni `*JobService`). Nessun permesso nuovo.
    'android.permission.RUN_USER_INITIATED_JOBS',
  ],
  // Permessi che l'app ha deciso di NON chiedere mai (il motivo e' nel messaggio): nessuna libreria deve portarli in silenzio. Gia' fuori
  // dall'elenco qui sopra; qui il rifiuto ha un nome e una ragione (Fase 5B, P0-B, D19 e docs/sicurezza.md §4-bis "Non richiesti").
  forbiddenPermissions: [
    'android.permission.MANAGE_MEDIA'            : 'le modifiche e le eliminazioni passano dai dialoghi di sistema (createWriteRequest, createTrashRequest, createDeleteRequest): seconda conferma gratuita, nessun permesso speciale',
    'android.permission.MANAGE_EXTERNAL_STORAGE' : 'non serve accedere a tutti i file: i media si leggono dal MediaStore e le cartelle le sceglie l utente con i selettori di sistema',
    // Fase 9 (P1, D35): li dichiara MapLibre e li toglie il filtro (`droppedLibraryPermissions`, sotto); se restassero, qui il manifest non passa.
    'android.permission.ACCESS_FINE_LOCATION'   : 'mai la posizione del telefono (Fase 9, D35): la mappa mostra dove sono state scattate le foto',
    'android.permission.ACCESS_COARSE_LOCATION' : 'mai la posizione del telefono (Fase 9, D35): la mappa mostra dove sono state scattate le foto',
    'android.permission.ACCESS_WIFI_STATE'      : 'la mappa non legge il Wi-Fi (Fase 9, D35): la rete in uso arriva da core-network con ACCESS_NETWORK_STATE',
  ],
  // Fase 9 (P1, D35; docs/sicurezza.md 4-bis "Non richiesti"): i permessi che una libreria dichiara e che l'app NON vuole, tolti dal manifest fuso
  // di ogni variante da `filter<Variante>NativeLibraries` (sotto) prima di `verifyReleaseManifest`, che li vieta comunque (`forbiddenPermissions`).
  // MapLibre Native Android 13.7.1 dichiara, oltre a INTERNET e ACCESS_NETWORK_STATE (gia' dell'app), la posizione precisa e approssimativa (per il
  // suo componente della posizione, che l'app non usa) e lo stato del Wi-Fi. Una chiave per permesso, con il motivo.
  droppedLibraryPermissions: [
    'android.permission.ACCESS_FINE_LOCATION'   : 'MapLibre: componente della posizione, non usato',
    'android.permission.ACCESS_COARSE_LOCATION' : 'MapLibre: componente della posizione, non usato',
    'android.permission.ACCESS_WIFI_STATE'      : 'MapLibre: stato del Wi-Fi, non usato (la rete arriva da core-network)',
  ],
  // Permessi che sono ammessi SOLO con un tetto di SDK: nome -> android:maxSdkVersion atteso. Senza l'attributo (o con un
  // altro valore) il manifest non passa: un READ_EXTERNAL_STORAGE senza tetto chiederebbe l'accesso ai file anche su
  // Android 13+, dove i permessi giusti sono READ_MEDIA_*.
  permissionMaxSdk: [
    'android.permission.READ_EXTERNAL_STORAGE': '32',
  ],
  // Componenti che NON devono comparire nel manifest fuso di release, nemmeno non esportati.
  forbiddenComponents: [
    // androidx.profileinstaller: receiver esportato (permesso DUMP) per installare un profilo con un broadcast. Serve
    // solo al Macrobenchmark (variante benchmarkRelease, `app/src/benchmarkRelease/`, P9): non e' un punto d'ingresso
    // che la release deve avere. AndroidManifest.xml lo toglie con tools:node="remove".
    'androidx.profileinstaller.ProfileInstallReceiver',
    // Fase 6 (P0, D41, risposta Q4): il provider con cui ML Kit si inizializza da solo all'avvio del processo. Lo toglie il manifest di
    // core-ai con tools:node="remove" (la via documentata da Google per l'avvio manuale): con la lettura del testo spenta ML Kit non
    // deve partire. `MlKit.initialize` lo chiama solo il cancello di core-ai/.../ocr/ (Phase6ArchitectureTest, tools/check.ps1).
    'com.google.mlkit.common.internal.MlKitInitProvider',
  ],
  // Fase 6 (P0, D3, D38): le sole librerie native del sistema che l'app puo' chiedere, tutte FACOLTATIVE (android:required="false"):
  // la GPU di LiteRT-LM (OpenCL). Senza, il motore va su CPU (E-A12). Le altre che litert-api 2.3.0 dichiara (DSP Qualcomm, Edge TPU,
  // MediaTek, varianti OpenCL) le toglie `filter<Variante>NativeLibraries` qui sotto: il ritaglio gira su CPU. docs/sicurezza.md 4-bis.
  allowedNativeLibraries: [
    'libOpenCL.so',
    'libvndksupport.so',
  ],
  // Fase 6 (P0, D38, D41, L49): i componenti che ML Kit (text-recognition 16.0.1 e le sue dipendenze: Play services, DataTransport,
  // Firebase Components) porta nel manifest fuso. Elenco CHIUSO, per nome: tutti NON esportati e inerti finche' ML Kit non parte (con
  // la lettura del testo spenta non parte mai: `MlKitInitProvider` e' tolto). Un componente con uno di questi prefissi che non e' qui
  // fa fallire la verifica: una versione nuova della libreria potrebbe portarne uno che si avvia da solo. Lo stesso elenco lo controlla
  // tools/check.ps1 sull'APK vero (anche nell'altra direzione: un componente sparito va tolto da qui). docs/sicurezza.md 4-bis.
  thirdPartyComponentPrefixes: [
    'com.google.mlkit.',
    'com.google.android.datatransport.',
    'com.google.android.gms.',
    'com.google.firebase.',
    'com.google.android.play.',
    'com.google.ai.edge.',
    // Fase 10 (P3, D10, D40): Glance (il widget). Elenco chiuso come per ML Kit: una versione nuova che porta un componente in piu' fa fallire il controllo.
    'androidx.glance.',
  ],
  allowedThirdPartyComponents: [
    // ML Kit: il registro dei suoi componenti interni (Firebase Components). Lo legge MlKitContext quando ML Kit si inizializza.
    'com.google.mlkit.common.internal.MlKitComponentDiscoveryService',
    // Play services (play-services-base): l'activity che mostra i dialoghi di risoluzione dei Play services. Mai avviata dall'app.
    'com.google.android.gms.common.api.GoogleApiActivity',
    // DataTransport (le statistiche di ML Kit): registro dei backend (voce `cct`), JobService e receiver che inviano la coda.
    // Partono solo dopo che ML Kit ha messo qualcosa in coda, cioe' solo con la lettura del testo attiva (D41).
    'com.google.android.datatransport.runtime.backends.TransportBackendDiscovery',
    'com.google.android.datatransport.runtime.scheduling.jobscheduling.JobInfoSchedulerService',
    'com.google.android.datatransport.runtime.scheduling.jobscheduling.AlarmManagerSchedulerBroadcastReceiver',
    // Fase 10 (P3, D10, D40; Glance 1.1.1, `glance-appwidget`): i componenti interni di Glance, tutti **non esportati** (lo dichiara il suo manifest). Nessuno parte da solo:
    // le due activity trampolino servono alle azioni con una lambda (il widget usa solo azioni di avvio di un'activity, nessuna lambda), i ricevitori alle sessioni di Glance
    // (il widget non ne apre: `GalleryWidgetReceiver` e' un `AppWidgetProvider` e usa Glance solo per comporre i `RemoteViews`). `GlanceRemoteViewsService` non c'e': vedi
    // `droppedLibraryComponents`.
    'androidx.glance.appwidget.action.ActionTrampolineActivity',
    'androidx.glance.appwidget.action.InvisibleActionTrampolineActivity',
    'androidx.glance.appwidget.action.ActionCallbackBroadcastReceiver',
    'androidx.glance.appwidget.UnmanagedSessionReceiver',
    'androidx.glance.appwidget.MyPackageReplacedReceiver',
  ],
  // Fase 10 (P3, D10, D40; docs/sicurezza.md 4-bis): i componenti che una libreria dichiara e che l'app NON vuole, tolti dal manifest fuso di ogni variante da
  // `filter<Variante>NativeLibraries` (sotto) prima di `verifyReleaseManifest`. Glance 1.1.1 dichiara **un** componente esportato, `GlanceRemoteViewsService` (con
  // `BIND_REMOTEVIEWS`, che puo' avere solo il sistema): serve alle liste (`LazyColumn`), che il widget non usa; un componente esportato che non serve non si tiene.
  droppedLibraryComponents: [
    'androidx.glance.appwidget.GlanceRemoteViewsService': 'Glance: il servizio delle liste del widget (esportato, BIND_REMOTEVIEWS); il widget non ha liste',
  ],
  // Fase 10 (P3, D6, D8, D10, Q4 (a)): il widget. Il ricevitore e' **uno solo** nel manifest fuso, non esportato; i file `appwidget-provider` (percorsi dalla radice, separati da `|`)
  // dichiarano solo la Home e nessuna sveglia. `widgetCategory` non e' nel manifest ma nel file `xml/` a cui rimanda, quindi si legge il sorgente.
  widgetPolicy: [
    'receiver'      : 'dev.pampa.mycloudgallery.feature.widget.glance.GalleryWidgetReceiver',
    'category'      : 'home_screen',
    'updatePeriod'  : '0',
    'providerFiles' : 'feature-widget/src/main/res/xml/gallery_widget_info.xml|feature-widget/src/main/res/xml-v31/gallery_widget_info.xml',
  ],
  // Fase 10 (P4, D14-D17, docs/sicurezza.md C434, L546): le finestre della `MainActivity`. I valori sono stringhe; gli elenchi si separano con `|` (come `configChanges`).
  mainActivityPolicy: [
    'name'                  : 'dev.pampa.mycloudgallery.MainActivity',
    // Il piano B (docs/fase10-progetto.md D16, §7): se singleInstancePerTask non regge con notifiche, widget o la finestra nuova di One UI, `singleTask` (una finestra sola),
    // dichiarato in docs/decisioni.md e in L. Oggi vale il primo.
    'launchMode'            : 'singleInstancePerTask',
    // Ricomposizione, non ricreazione: MapLibre, il video, lo zoom e lo scorrimento restano (D14).
    'requiredConfigChanges' : 'orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation',
    // Questi DEVONO ricreare l'activity (densita', lingua, tema, dimensione del testo): lo stato salvato si prova solo se la ricreazione succede davvero.
    'forbiddenConfigChanges': 'density|locale|layoutDirection|uiMode|fontScale|colorMode|fontWeightAdjustment',
    'resizeableActivity'    : 'true',
    // StrandHogg (revisione 2, F13): vuota.
    'taskAffinity'          : '',
    // D15: la finestra minima (sotto, Android non scende).
    'minWidth'              : '320dp',
    'minHeight'             : '400dp',
  ],
]

// Fase 6 (P0): toglie dal manifest fuso le `uses-native-library` che non sono in `allowedNativeLibraries` e i doppioni. Il fusore dei
// manifest di AGP 8.13 non da' una chiave a quell'elemento (le accoda tutte, anche ripetute) e ignora tools:node="remove": litert-api
// 2.3.0 ne dichiara 31. E' una trasformazione dell'artefatto MERGED_MANIFEST di ogni variante (app/build.gradle la lega), quindi vale
// per l'APK e per `verifyReleaseManifest`, che ricontrolla l'esito. Lavora sul testo: tocca solo gli elementi `uses-native-library`.
// Fase 9 (P1, D35): toglie anche i `uses-permission` (e `uses-permission-sdk-23`) elencati in `droppedLibraryPermissions`, quelli che MapLibre
// porta (la posizione e lo stato del Wi-Fi). Un `tools:node="remove"` nel manifest di feature-map non si puo' (Phase9ArchitectureTest regola
// 10: i moduli nuovi non nominano permessi nel manifest) e il manifest dell'app e' di P13: qui vale per ogni variante, debug compresa.
abstract class FilterNativeLibraries extends DefaultTask {

  @InputFile
  @PathSensitive(PathSensitivity.NONE)
  abstract RegularFileProperty getMergedManifest()

  @OutputFile
  abstract RegularFileProperty getUpdatedManifest()

  @Input
  abstract ListProperty<String> getAllowed()

  @Input
  abstract ListProperty<String> getDroppedPermissions()

  @Input
  abstract ListProperty<String> getDroppedComponents()

  @TaskAction
  void filter() {
    String text = mergedManifest.get().asFile.getText('UTF-8')
    def seen = new HashSet<String>()
    def element = ~/(?s)[ \t]*<uses-native-library\b[^>]*?\/>[ \t]*\r?\n?/
    String out = text.replaceAll(element) { String match ->
      def name = (match =~ /android:name\s*=\s*"([^"]*)"/)
      String library = name.find() ? name.group(1) : ''
      (library in allowed.get() && seen.add(library)) ? match : ''
    }
    def permission = ~/(?s)[ \t]*<uses-permission(?:-sdk-23)?\b[^>]*?\/>[ \t]*\r?\n?/
    out = out.replaceAll(permission) { String match ->
      def name = (match =~ /android:name\s*=\s*"([^"]*)"/)
      (name.find() && name.group(1) in droppedPermissions.get()) ? '' : match
    }
    // Fase 10 (P3, D10, D40): i componenti che una libreria porta e l'app non vuole (`droppedLibraryComponents`): l'elemento intero, qualunque sia il tipo.
    droppedComponents.get().each { String name ->
      def component = ~/(?s)[ \t]*<(?:service|receiver|activity|provider)\b[^>]*?android:name\s*=\s*"${java.util.regex.Pattern.quote(name)}"[^>]*?\/>[ \t]*\r?\n?/
      out = out.replaceAll(component, '')
    }
    updatedManifest.get().asFile.setText(out, 'UTF-8')
  }
}

// Lo lega app/build.gradle per ogni variante (lo script non vede le classi di AGP):
//
//   androidComponents {
//     onVariants(selector().all()) { variant ->
//       variant.artifacts.use(registerNativeLibraryFilter(variant))
//         .wiredWithFiles({ it.mergedManifest }, { it.updatedManifest })
//         .toTransform(SingleArtifact.MERGED_MANIFEST.INSTANCE)
//     }
//   }
ext.registerNativeLibraryFilter = { variant ->
  return tasks.register("filter${variant.name.capitalize()}NativeLibraries", FilterNativeLibraries) {
    group = 'build'
    description = "Tiene nel manifest fuso di ${variant.name} solo le uses-native-library ammesse (Fase 6, D38) e toglie i permessi non voluti delle librerie (Fase 9, D35)."
    allowed.set(releaseManifestPolicy.allowedNativeLibraries)
    droppedPermissions.set(releaseManifestPolicy.droppedLibraryPermissions.keySet().toList())
    droppedComponents.set(releaseManifestPolicy.droppedLibraryComponents.keySet().toList())
  }
}

abstract class VerifyReleaseManifest extends DefaultTask {

  @InputFile
  @PathSensitive(PathSensitivity.NONE)
  abstract RegularFileProperty getMergedManifest()

  @Input
  abstract Property<String> getApplicationId()

  @Input
  abstract ListProperty<String> getAllowedExported()

  @Input
  abstract MapProperty<String, String> getExportedRequiresPermission()

  @Input
  abstract ListProperty<String> getAllowedPermissions()

  @Input
  abstract MapProperty<String, String> getForbiddenPermissions()

  @Input
  abstract MapProperty<String, String> getPermissionMaxSdk()

  @Input
  abstract ListProperty<String> getForbiddenComponents()

  @Input
  abstract ListProperty<String> getAllowedNativeLibraries()

  @Input
  abstract ListProperty<String> getThirdPartyComponentPrefixes()

  @Input
  abstract ListProperty<String> getAllowedThirdPartyComponents()

  @Input
  abstract MapProperty<String, String> getMainActivityPolicy()

  // Fase 10 (P3): la politica del widget e i suoi file `appwidget-provider` (il sorgente: `widgetCategory` non e' nel manifest, e' nel file a cui il ricevitore rimanda).
  @Input
  abstract MapProperty<String, String> getWidgetPolicy()

  @InputFiles
  @PathSensitive(PathSensitivity.NONE)
  abstract ConfigurableFileCollection getWidgetProviderFiles()

  // Il manifest fuso usa sempre il prefisso `android:`, quindi si legge senza risolvere i namespace.
  static String attr(Object node, String name) {
    return node.attributes()['android:' + name]
  }

  // Fase 10 (P4): cio' che la `MainActivity` deve dichiarare per avere finestre che si ridimensionano, si ricreano e si contano (D14-D17). Statico e puro: lo prova il test
  // `MainActivityWindowsManifestTest` di `:app` sul manifest dell'app, e `assembleRelease` sul manifest fuso.
  static List<String> verifyMainActivity(Object application, Map<String, String> policy) {
    def problems = []
    String name = policy['name']
    def main = application.activity.find { attr(it, 'name') == name }
    if (main.size() == 0) {
      problems << "manca l'activity ${name}".toString()
      return problems
    }
    def allowedLaunch = policy['launchMode'].split('[|]') as List
    String launch = attr(main, 'launchMode')
    if (!(launch in allowedLaunch)) {
      problems << "${name}: android:launchMode deve essere ${allowedLaunch.join(' o ')} (trovato ${launch})".toString()
    }
    def declared = (attr(main, 'configChanges') ?: '').split('[|]').collect { it.trim() }.findAll { !it.isEmpty() }
    policy['requiredConfigChanges'].split('[|]').each { required ->
      if (!(required in declared)) problems << "${name}: android:configChanges deve contenere ${required} (ricomposizione, non ricreazione: D14)".toString()
    }
    policy['forbiddenConfigChanges'].split('[|]').each { forbidden ->
      if (forbidden in declared) problems << "${name}: android:configChanges NON deve contenere ${forbidden} (deve ricreare l'activity: D14)".toString()
    }
    if (attr(main, 'resizeableActivity') != policy['resizeableActivity']) {
      problems << "${name}: android:resizeableActivity deve essere ${policy['resizeableActivity']} (D15)".toString()
    }
    // Attenzione: una stringa vuota e' "falsa" in Groovy, quindi niente `?:`: l'attributo c'e' ed e' vuoto, oppure non c'e'.
    String affinity = attr(main, 'taskAffinity')
    if (affinity == null || affinity != policy['taskAffinity']) {
      problems << "${name}: android:taskAffinity deve essere vuota (StrandHogg, F13)".toString()
    }
    def layouts = main.layout
    if (layouts.size() == 0) {
      problems << "${name}: manca <layout> con la misura minima (D15)".toString()
    } else {
      if (attr(layouts[0], 'minWidth') != policy['minWidth']) problems << "${name}: <layout> android:minWidth deve essere ${policy['minWidth']} (D15)".toString()
      if (attr(layouts[0], 'minHeight') != policy['minHeight']) problems << "${name}: <layout> android:minHeight deve essere ${policy['minHeight']} (D15)".toString()
    }
    return problems
  }

  // Fase 10 (P3, D6, D8, D10, Q4 (a), C432): il widget "MyCloud Gallery". Il ricevitore e' uno solo fra quelli che dichiarano `android.appwidget.provider`, non esportato; i file
  // `appwidget-provider` dichiarano solo la Home e nessuna sveglia. Statico e puro: lo prova `WidgetManifestTest` di `:feature-widget` sui sorgenti e `assembleRelease` sul manifest fuso.
  static List<String> verifyWidget(Object application, Map<String, String> policy, List<String> providerTexts) {
    def problems = []
    String name = policy['receiver']
    def providers = application.receiver.findAll { r -> r.'meta-data'.any { attr(it, 'name') == 'android.appwidget.provider' } }
    def names = providers.collect { attr(it, 'name') }
    if (names != [name]) {
      problems << "i ricevitori di widget devono essere solo ${name} (trovati ${names})".toString()
    }
    def ours = providers.find { attr(it, 'name') == name }
    if (ours != null && attr(ours, 'exported') != 'false') {
      problems << "il ricevitore del widget ${name} deve essere esplicitamente NON esportato (android:exported=\"false\")".toString()
    }
    if (providerTexts.isEmpty()) problems << "nessun file appwidget-provider da controllare (widgetProviderFiles e' vuoto)"
    providerTexts.each { text ->
      def category = (text =~ /android:widgetCategory\s*=\s*"([^"]*)"/)
      String found = category.find() ? category.group(1) : null
      if (found != policy['category']) {
        problems << "il widget deve dichiarare solo la Home: android:widgetCategory=\"${policy['category']}\" (trovato ${found}): mai sulla schermata di blocco (Q4 (a))".toString()
      }
      def period = (text =~ /android:updatePeriodMillis\s*=\s*"([^"]*)"/)
      String foundPeriod = period.find() ? period.group(1) : null
      if (foundPeriod != policy['updatePeriod']) {
        problems << "il widget deve avere android:updatePeriodMillis=\"${policy['updatePeriod']}\" (trovato ${foundPeriod}): nessuna sveglia di Android (D6)".toString()
      }
    }
    return problems
  }

  @TaskAction
  void verify() {
    def root = new XmlSlurper(false, false).parse(mergedManifest.get().asFile)
    def problems = []

    def applications = root.application
    if (applications.size() == 0) {
      problems << 'il manifest fuso non ha l\'elemento <application>'
    } else {
      def application = applications[0]
      if (attr(application, 'debuggable') == 'true') {
        problems << 'la release e\' DEBUGGABLE (android:debuggable="true")'
      }
      if (attr(application, 'allowBackup') != 'false') {
        problems << 'android:allowBackup deve essere "false"'
      }
      if (!attr(application, 'dataExtractionRules')) {
        problems << 'manca android:dataExtractionRules (esclusione di backup cloud e device-transfer)'
      }
      if (attr(application, 'usesCleartextTraffic') != 'false') {
        problems << 'android:usesCleartextTraffic deve essere "false"'
      }

      ['activity', 'activity-alias', 'service', 'receiver', 'provider'].each { kind ->
        application."${kind}".each { component ->
          String name = attr(component, 'name')
          String exported = attr(component, 'exported')
          boolean hasFilter = component.'intent-filter'.size() > 0
          if (exported == 'true' && !(name in allowedExported.get())) {
            problems << "componente ESPORTATO non ammesso: <${kind}> ${name}".toString()
          } else if (exported == null && hasFilter && !(name in allowedExported.get())) {
            problems << "<${kind}> ${name} ha un intent-filter senza android:exported esplicito".toString()
          }
          if (name in forbiddenComponents.get()) {
            problems << "componente VIETATO in release: <${kind}> ${name}".toString()
          }
          // Fase 4B (D29): ogni JobService e' legato solo dal sistema (JobScheduler), quindi deve richiedere BIND_JOB_SERVICE.
          if (kind == 'service' && name != null && name.endsWith('JobService') &&
              attr(component, 'permission') != 'android.permission.BIND_JOB_SERVICE') {
            problems << "<service> ${name} e' un JobService senza android:permission=\"android.permission.BIND_JOB_SERVICE\"".toString()
          }
          // Un componente ammesso perche' protetto deve dichiarare ESATTAMENTE il permesso atteso.
          String required = exportedRequiresPermission.get()[name]
          if (required != null && exported != 'false' && attr(component, 'permission') != required) {
            problems << "<${kind}> ${name} e' esportato senza il permesso ${required}".toString()
          }
          // Fase 6 (D41, L49): i componenti delle librerie di Google portate da ML Kit e da LiteRT: elenco chiuso, mai esportati.
          if (name != null && thirdPartyComponentPrefixes.get().any { name.startsWith(it) }) {
            if (!(name in allowedThirdPartyComponents.get())) {
              problems << "componente di una libreria di Google NON nell'elenco chiuso: <${kind}> ${name} (potrebbe avviarsi da solo: docs/sicurezza.md 4-bis)".toString()
            } else if (exported == 'true') {
              problems << "<${kind}> ${name} e' nell'elenco chiuso ma e' ESPORTATO".toString()
            }
          }
        }
      }

      // Fase 10 (P4, D14-D17): le impostazioni delle finestre della MainActivity.
      problems.addAll(verifyMainActivity(application, mainActivityPolicy.get()))

      // Fase 10 (P3, D6, D8, D10): il widget, solo Home, e il suo ricevitore non esportato.
      problems.addAll(verifyWidget(application, widgetPolicy.get(), widgetProviderFiles.files.collect { it.getText('UTF-8') }))

      // Fase 6 (D3, D38): solo le librerie native della GPU, facoltative.
      application.'uses-native-library'.each { library ->
        String name = attr(library, 'name')
        if (!(name in allowedNativeLibraries.get())) {
          problems << "uses-native-library non ammessa: ${name} (solo ${allowedNativeLibraries.get().join(', ')})".toString()
        } else if (attr(library, 'required') != 'false') {
          problems << "uses-native-library ${name} deve essere facoltativa (android:required=\"false\")".toString()
        }
      }
    }

    def allowedPerms = allowedPermissions.get().collect { it.replace('{applicationId}', applicationId.get()) }
    ['uses-permission', 'uses-permission-sdk-23', 'uses-permission-sdk-m'].each { tag ->
      root."${tag}".each { permission ->
        String name = attr(permission, 'name')
        String forbiddenWhy = forbiddenPermissions.get()[name]
        if (forbiddenWhy != null) {
          problems << "permesso VIETATO: ${name} (${forbiddenWhy})".toString()
        } else if (!(name in allowedPerms)) {
          problems << "permesso non ammesso: ${name} (documentalo in docs/sicurezza.md 4-bis e aggiungilo a releaseManifestPolicy)".toString()
        }
        String expectedMax = permissionMaxSdk.get()[name]
        if (expectedMax != null && attr(permission, 'maxSdkVersion') != expectedMax) {
          problems << "il permesso ${name} deve avere android:maxSdkVersion=\"${expectedMax}\"".toString()
        }
      }
    }

    if (!problems.isEmpty()) {
      throw new GradleException(
        "Il manifest di release NON passa il controllo di sicurezza:\n  - " + problems.join('\n  - ') +
          "\n(file: ${mergedManifest.get().asFile})"
      )
    }
    logger.lifecycle('Manifest di release: non debuggable, backup escluso, nessun componente esposto oltre quelli ammessi.')
  }
}

// Lo script non puo' nominare le classi di AGP (un file applicato non vede il classpath dei plugin):
// e' app/build.gradle a passargli il manifest fuso di ogni variante release.
//
//   androidComponents {
//     onVariants(selector().withBuildType('release')) { variant ->
//       registerVerifyReleaseManifest(variant, variant.artifacts.get(SingleArtifact.MERGED_MANIFEST.INSTANCE))
//     }
//   }
ext.registerVerifyReleaseManifest = { variant, mergedManifestArtifact ->
  def verifyTask = tasks.register("verify${variant.name.capitalize()}Manifest", VerifyReleaseManifest) {
    group = 'verification'
    description = "Fallisce se il manifest fuso di ${variant.name} e' debuggable, permette il backup o espone componenti."
    mergedManifest.set(mergedManifestArtifact)
    applicationId.set(variant.applicationId)
    allowedExported.set(releaseManifestPolicy.allowedExported)
    exportedRequiresPermission.set(releaseManifestPolicy.exportedRequiresPermission)
    allowedPermissions.set(releaseManifestPolicy.allowedPermissions)
    forbiddenPermissions.set(releaseManifestPolicy.forbiddenPermissions)
    permissionMaxSdk.set(releaseManifestPolicy.permissionMaxSdk)
    forbiddenComponents.set(releaseManifestPolicy.forbiddenComponents)
    allowedNativeLibraries.set(releaseManifestPolicy.allowedNativeLibraries)
    thirdPartyComponentPrefixes.set(releaseManifestPolicy.thirdPartyComponentPrefixes)
    allowedThirdPartyComponents.set(releaseManifestPolicy.allowedThirdPartyComponents)
    mainActivityPolicy.set(releaseManifestPolicy.mainActivityPolicy)
    widgetPolicy.set(releaseManifestPolicy.widgetPolicy)
    widgetProviderFiles.from(releaseManifestPolicy.widgetPolicy['providerFiles'].split('[|]').collect { rootProject.file(it) })
  }
  // Un APK che non passa il controllo non si produce nemmeno.
  tasks.configureEach { task ->
    if (task.name == "assemble${variant.name.capitalize()}") {
      task.dependsOn(verifyTask)
    }
  }
}
