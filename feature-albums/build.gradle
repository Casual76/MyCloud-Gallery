// Le schermate degli album della Fase 7 (docs/fase7-progetto.md §1.1, §1.5; D12, D21, D31 con la risposta Q5, D32, D35; riga P10 del
// §4.4): elenco e pagina degli album, editor delle regole, "Suggerite" e "Da condividere", fogli di condivisione, permessi e chiusura,
// proposte di viaggio. Scheletro di P0 (modulo, stati sigillati del §1.5 come contratto, azioni come porta, stati di esempio per i
// test); le schermate sono di P10.
//
// **Aspetto: linguaggio grafico G2** (D32): le composable usano solo i componenti esistenti di `core-designsystem`
// (`GalleryShareSheetContent`, `GalleryBadge.Shared` cosi' come sono), nessuno stile nuovo; il filone grafico rifinisce senza toccare
// la logica.
//
// Vede di core-albums solo contratti, null-object e fake (stati e comandi): **cieca a core-nas, core-nasops, core-backup, core-index e
// core-trust** (Phase7ArchitectureTest, anche per inferenza: core-albums li tiene `implementation`). Il foglio di condivisione emette la
// `ShareConfirmation` (`ShareConfirmationSheet`) dopo un tocco: l'unico posto della UI, con :app, che puo' farlo. I `feature-*` non si
// conoscono fra loro.
//
// D7 della Fase 2: @HiltViewModel (KSP). Nessuna rete (NoNetworkSourcesTest), nessun orologio del telefono (NoWallClockSourcesTest).
// Stringhe in `values/strings_albums_*.xml` e `values/strings_trips_*.xml`.
plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'org.jetbrains.kotlin.plugin.serialization'
  id 'com.google.devtools.ksp'
  id 'com.google.dagger.hilt.android'
  id 'io.github.takahirom.roborazzi'
}

apply from: "${rootDir}/engine/versions.gradle"
apply from: "${rootDir}/versions-app.gradle"
apply from: "${rootDir}/gradle/android-conventions.gradle"

android {
  namespace = 'dev.pampa.mycloudgallery.feature.albums'

  buildFeatures {
    compose = true
  }

  testOptions {
    unitTests.all {
      maxHeapSize = '2g'
    }
  }
}

dependencies {
  // api: i contratti degli album (album, contenuto, piani, permessi, proposte) e i componenti (core-designsystem) compaiono negli stati.
  api project(':core-albums')
  api project(':core-designsystem')

  // La Libreria (viste e celle) e le miniature locali.
  implementation project(':core-library')
  implementation project(':core-imaging')

  implementation project(':core-common')
  implementation project(':core-model')

  implementation appDeps.hiltAndroid
  ksp appDeps.hiltCompiler
  implementation appDeps.hiltNavigationCompose
  implementation appDeps.navigationCompose
  implementation appDeps.lifecycleViewModelCompose
  implementation appDeps.lifecycleRuntimeCompose
  implementation appDeps.coroutinesAndroid
  implementation appDeps.serializationCore

  // Solo per CollectionsSectionBindingTest (P10): prova che i dati delle sezioni Album, Album smart e Viaggi entrano nel gruppo e nel fornitore veri delle Raccolte.
  // E' una dipendenza di prova: in produzione i feature non si conoscono (Phase4ArchitectureTest guarda solo le dipendenze di produzione).
  testImplementation project(':feature-library')
  testImplementation appDeps.coroutinesTest
  testImplementation appDeps.turbine
  testImplementation appDeps.robolectric
  testImplementation appDeps.androidxTestCore
  testImplementation appDeps.androidxTestExtJunit
  testImplementation platform("androidx.compose:compose-bom:${engine.composeBom}")
  testImplementation appDeps.composeUiTestJunit4
  testImplementation appDeps.composeUiTestManifest
  testImplementation appDeps.roborazzi
  testImplementation appDeps.roborazziCompose
  testImplementation appDeps.roborazziJunitRule
}
